<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>CraveMatch - It's a Match!</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary-fixed-variant": "#004f55",
              "on-background": "#191c1d",
              "inverse-primary": "#ffb4a5",
              "secondary-container": "#feb23f",
              "on-secondary-container": "#6e4600",
              "surface-container-lowest": "#ffffff",
              secondary: "#835500",
              "on-secondary-fixed-variant": "#633f00",
              outline: "#8e706a",
              "surface-bright": "#f8fafb",
              "primary-fixed-dim": "#ffb4a5",
              "secondary-fixed-dim": "#ffb955",
              "surface-container-highest": "#e1e3e4",
              "on-primary-fixed-variant": "#8e1500",
              "on-primary-fixed": "#3e0400",
              "error-container": "#ffdad6",
              surface: "#f8fafb",
              "tertiary-fixed": "#84f3ff",
              "surface-container-low": "#f2f4f5",
              "outline-variant": "#e3beb7",
              "surface-variant": "#e1e3e4",
              "on-tertiary-fixed": "#002023",
              "secondary-fixed": "#ffddb4",
              tertiary: "#006971",
              "on-error": "#ffffff",
              "surface-container": "#eceeef",
              error: "#ba1a1a",
              "tertiary-fixed-dim": "#5cd7e4",
              background: "#f8fafb",
              "on-tertiary": "#ffffff",
              "on-secondary": "#ffffff",
              "tertiary-container": "#00a4b0",
              "on-surface-variant": "#5a413b",
              "on-tertiary-container": "#003337",
              "surface-tint": "#b3290f",
              "primary-fixed": "#ffdad3",
              "inverse-surface": "#2e3132",
              "on-surface": "#191c1d",
              "surface-dim": "#d8dadb",
              "primary-container": "#ff5f40",
              "inverse-on-surface": "#eff1f2",
              "on-primary-container": "#5f0a00",
              "surface-container-high": "#e6e8e9",
              "on-error-container": "#93000a",
              "on-primary": "#ffffff",
              "on-secondary-fixed": "#291800",
              primary: "#b3290f",
            },
            borderRadius: {
              DEFAULT: "1rem",
              lg: "2rem",
              xl: "3rem",
              full: "9999px",
            },
            spacing: {
              "stack-sm": "12px",
              "stack-md": "24px",
              "container-padding": "24px",
              gutter: "16px",
              "stack-lg": "40px",
              base: "8px",
            },
            fontFamily: {
              h2: ["Plus Jakarta Sans"],
              "label-caps": ["Plus Jakarta Sans"],
              "body-lg": ["Plus Jakarta Sans"],
              display: ["Plus Jakarta Sans"],
              "body-md": ["Plus Jakarta Sans"],
              h1: ["Plus Jakarta Sans"],
            },
            fontSize: {
              h2: [
                "24px",
                {
                  lineHeight: "32px",
                  fontWeight: "700",
                },
              ],
              "label-caps": [
                "12px",
                {
                  lineHeight: "16px",
                  letterSpacing: "0.05em",
                  fontWeight: "700",
                },
              ],
              "body-lg": [
                "18px",
                {
                  lineHeight: "28px",
                  fontWeight: "500",
                },
              ],
              display: [
                "40px",
                {
                  lineHeight: "48px",
                  letterSpacing: "-0.02em",
                  fontWeight: "800",
                },
              ],
              "body-md": [
                "16px",
                {
                  lineHeight: "24px",
                  fontWeight: "400",
                },
              ],
              h1: [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.01em",
                  fontWeight: "700",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background font-body-md text-on-background antialiased flex justify-center items-center min-h-screen bg-black/50 backdrop-blur-xl"
  >
    <div
      class="w-full max-w-[430px] h-[884px] relative bg-white/10 backdrop-blur-[20px] shadow-[0_32px_64px_rgba(255,95,64,0.15)] flex flex-col justify-between items-center px-container-padding py-stack-lg overflow-hidden border border-white/20"
    >
      <div
        class="absolute inset-0 z-0 opacity-40 pointer-events-none mix-blend-overlay"
        style="
          background: radial-gradient(
            circle at 50% 50%,
            rgba(255, 95, 64, 0.8) 0%,
            transparent 70%
          );
        "
      ></div>
      <div class="z-10 w-full flex justify-end">
        <button
          class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center text-white hover:bg-white/30 transition-colors backdrop-blur-md"
        >
          <span
            class="material-symbols-outlined"
            style="font-variation-settings: &quot;FILL&quot; 0"
            >close</span
          >
        </button>
      </div>
      <div
        class="z-10 flex flex-col items-center gap-stack-md text-center mt-stack-md"
      >
        <h1 class="font-display text-display text-white drop-shadow-md">
          🎉 It's a Match!
        </h1>
        <div
          class="relative w-48 h-48 mt-stack-md flex items-center justify-center"
        >
          <div
            class="absolute inset-0 bg-primary-container/20 rounded-full blur-2xl animate-pulse"
          ></div>
          <div
            class="w-40 h-40 bg-white rounded-full shadow-[0_16px_32px_rgba(255,95,64,0.3)] flex items-center justify-center relative z-10 border-4 border-primary-container"
          >
            <span class="text-[80px]">🍜</span>
          </div>
        </div>
        <div class="mt-stack-md">
          <p class="font-h2 text-h2 text-white">
            You both want:
            <span class="text-secondary-container font-extrabold">Ramen</span>
          </p>
        </div>
      </div>
      <div class="z-10 w-full mb-stack-md">
        <button
          class="w-full bg-primary-container text-white py-4 rounded-xl font-h2 text-h2 flex items-center justify-center gap-gutter shadow-[0_16px_32px_rgba(255,95,64,0.3)] hover:scale-[1.02] transition-transform active:scale-95"
        >
          <span
            class="material-symbols-outlined"
            style="font-variation-settings: &quot;FILL&quot; 1"
            >map</span
          >
          See places
        </button>
        <button
          class="w-full mt-stack-sm text-white/80 font-body-lg text-body-lg py-3 hover:text-white transition-colors"
        >
          Keep swiping
        </button>
      </div>
    </div>
  </body>
</html>
