<!doctype html>

<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>BiteMatch - Results</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "on-tertiary-fixed-variant": "#004f55",
              "on-background": "#191c1d",
              "inverse-primary": "#ffb4a5",
              "secondary-container": "#feb23f",
              "on-secondary-container": "#6e4600",
              "surface-container-lowest": "#ffffff",
              secondary: "#835500",
              "on-secondary-fixed-variant": "#633f00",
              outline: "#8e706a",
              "surface-bright": "#f8fafb",
              "primary-fixed-dim": "#ffb4a5",
              "secondary-fixed-dim": "#ffb955",
              "surface-container-highest": "#e1e3e4",
              "on-primary-fixed-variant": "#8e1500",
              "on-primary-fixed": "#3e0400",
              "error-container": "#ffdad6",
              surface: "#f8fafb",
              "tertiary-fixed": "#84f3ff",
              "surface-container-low": "#f2f4f5",
              "outline-variant": "#e3beb7",
              "surface-variant": "#e1e3e4",
              "on-tertiary-fixed": "#002023",
              "secondary-fixed": "#ffddb4",
              tertiary: "#006971",
              "on-error": "#ffffff",
              "surface-container": "#eceeef",
              error: "#ba1a1a",
              "tertiary-fixed-dim": "#5cd7e4",
              background: "#f8fafb",
              "on-tertiary": "#ffffff",
              "on-secondary": "#ffffff",
              "tertiary-container": "#00a4b0",
              "on-surface-variant": "#5a413b",
              "on-tertiary-container": "#003337",
              "surface-tint": "#b3290f",
              "primary-fixed": "#ffdad3",
              "inverse-surface": "#2e3132",
              "on-surface": "#191c1d",
              "surface-dim": "#d8dadb",
              "primary-container": "#ff5f40",
              "inverse-on-surface": "#eff1f2",
              "on-primary-container": "#5f0a00",
              "surface-container-high": "#e6e8e9",
              "on-error-container": "#93000a",
              "on-primary": "#ffffff",
              "on-secondary-fixed": "#291800",
              primary: "#b3290f",
            },
            borderRadius: {
              DEFAULT: "1rem",
              lg: "2rem",
              xl: "3rem",
              full: "9999px",
            },
            spacing: {
              "stack-sm": "12px",
              "stack-md": "24px",
              "container-padding": "24px",
              gutter: "16px",
              "stack-lg": "40px",
              base: "8px",
            },
            fontFamily: {
              h2: ["Plus Jakarta Sans"],
              "label-caps": ["Plus Jakarta Sans"],
              "body-lg": ["Plus Jakarta Sans"],
              display: ["Plus Jakarta Sans"],
              "body-md": ["Plus Jakarta Sans"],
              h1: ["Plus Jakarta Sans"],
            },
            fontSize: {
              h2: ["24px", { lineHeight: "32px", fontWeight: "700" }],
              "label-caps": [
                "12px",
                {
                  lineHeight: "16px",
                  letterSpacing: "0.05em",
                  fontWeight: "700",
                },
              ],
              "body-lg": ["18px", { lineHeight: "28px", fontWeight: "500" }],
              display: [
                "40px",
                {
                  lineHeight: "48px",
                  letterSpacing: "-0.02em",
                  fontWeight: "800",
                },
              ],
              "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
              h1: [
                "32px",
                {
                  lineHeight: "40px",
                  letterSpacing: "-0.01em",
                  fontWeight: "700",
                },
              ],
            },
          },
        },
      };
    </script>
    <style>
      body {
        min-height: max(884px, 100dvh);
      }
    </style>
  </head>
  <body
    class="bg-background text-on-background antialiased h-screen overflow-hidden flex flex-col items-center justify-start max-w-[430px] mx-auto relative shadow-2xl"
  >
    <!-- TopAppBar -->
    <header
      class="fixed top-0 left-0 w-full flex justify-between items-center px-6 h-16 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md z-50 max-w-[430px] mx-auto right-0"
    >
      <button
        class="text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors p-2 rounded-full"
      >
        <span
          class="material-symbols-outlined"
          data-icon="arrow_back"
          data-weight="fill"
          style="font-variation-settings: &quot;FILL&quot; 1"
          >arrow_back</span
        >
      </button>
      <span class="font-h1 text-h1 text-[#FF5F40] font-black tracking-tighter"
        >CraveMatch</span
      >
      <button
        class="text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors p-2 rounded-full"
      >
        <span
          class="material-symbols-outlined"
          data-icon="settings"
          data-weight="fill"
          style="font-variation-settings: &quot;FILL&quot; 1"
          >settings</span
        >
      </button>
    </header>
    <!-- Main Content Canvas -->
    <main
      class="w-full flex-1 overflow-y-auto px-container-padding pt-24 pb-32"
    >
      <!-- Header Section -->
      <div class="mb-stack-lg">
        <h1 class="font-display text-display text-on-background mb-stack-sm">
          Where to eat <span class="text-primary-container">Ramen</span>
        </h1>
        <p class="font-body-md text-body-md text-on-surface-variant">
          Top 3 matches near you based on your cravings.
        </p>
      </div>
      <!-- Results List -->
      <div class="flex flex-col gap-stack-md">
        <!-- Result Card 1 -->
        <button
          class="w-full text-left bg-surface-container-lowest rounded-DEFAULT p-4 flex items-center justify-between shadow-[0_12px_32px_rgba(255,95,64,0.08)] hover:shadow-[0_16px_40px_rgba(255,95,64,0.12)] transition-shadow group relative overflow-hidden"
        >
          <div class="flex flex-col gap-1 z-10">
            <span class="font-h2 text-h2 text-on-background"
              >Ichiraku Ramen</span
            >
            <span
              class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1"
            >
              <span
                class="material-symbols-outlined text-[16px]"
                data-icon="location_on"
                >location_on</span
              >
              0.5 miles • Open now
            </span>
            <div class="flex gap-2 mt-2">
              <span
                class="bg-primary-container/10 text-primary-container font-label-caps text-label-caps px-2 py-1 rounded-full"
                >Spicy</span
              >
              <span
                class="bg-primary-container/10 text-primary-container font-label-caps text-label-caps px-2 py-1 rounded-full"
                >Authentic</span
              >
            </div>
          </div>
          <div
            class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary transition-colors z-10"
          >
            <span class="material-symbols-outlined" data-icon="map">map</span>
          </div>
        </button>
        <!-- Result Card 2 -->
        <button
          class="w-full text-left bg-surface-container-lowest rounded-DEFAULT p-4 flex items-center justify-between shadow-[0_12px_32px_rgba(255,95,64,0.08)] hover:shadow-[0_16px_40px_rgba(255,95,64,0.12)] transition-shadow group relative overflow-hidden"
        >
          <div class="flex flex-col gap-1 z-10">
            <span class="font-h2 text-h2 text-on-background"
              >Momofuku Noodle Bar</span
            >
            <span
              class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1"
            >
              <span
                class="material-symbols-outlined text-[16px]"
                data-icon="location_on"
                >location_on</span
              >
              1.2 miles • Closes 11pm
            </span>
            <div class="flex gap-2 mt-2">
              <span
                class="bg-primary-container/10 text-primary-container font-label-caps text-label-caps px-2 py-1 rounded-full"
                >Modern</span
              >
              <span
                class="bg-primary-container/10 text-primary-container font-label-caps text-label-caps px-2 py-1 rounded-full"
                >$$$</span
              >
            </div>
          </div>
          <div
            class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary transition-colors z-10"
          >
            <span class="material-symbols-outlined" data-icon="map">map</span>
          </div>
        </button>
        <!-- Result Card 3 -->
        <button
          class="w-full text-left bg-surface-container-lowest rounded-DEFAULT p-4 flex items-center justify-between shadow-[0_12px_32px_rgba(255,95,64,0.08)] hover:shadow-[0_16px_40px_rgba(255,95,64,0.12)] transition-shadow group relative overflow-hidden"
        >
          <div class="flex flex-col gap-1 z-10">
            <span class="font-h2 text-h2 text-on-background">Tonkotsu Ya</span>
            <span
              class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1"
            >
              <span
                class="material-symbols-outlined text-[16px]"
                data-icon="location_on"
                >location_on</span
              >
              2.0 miles • Open now
            </span>
            <div class="flex gap-2 mt-2">
              <span
                class="bg-primary-container/10 text-primary-container font-label-caps text-label-caps px-2 py-1 rounded-full"
                >Rich Broth</span
              >
              <span
                class="bg-primary-container/10 text-primary-container font-label-caps text-label-caps px-2 py-1 rounded-full"
                >Casual</span
              >
            </div>
          </div>
          <div
            class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center group-hover:bg-primary-container group-hover:text-on-primary transition-colors z-10"
          >
            <span class="material-symbols-outlined" data-icon="map">map</span>
          </div>
        </button>
      </div>
    </main>
    <!-- BottomNavBar -->
    <nav
      class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-8 pb-8 pt-4 bg-white dark:bg-slate-950 rounded-t-[32px] border-t border-slate-100 dark:border-slate-800 shadow-[0_-8px_32px_rgba(255,95,64,0.08)] max-w-[430px] mx-auto right-0"
    >
      <button
        class="flex flex-col items-center justify-center bg-[#FF5F40]/10 text-[#FF5F40] rounded-full p-3 transition-all"
      >
        <span
          class="material-symbols-outlined text-2xl"
          data-icon="restaurant"
          data-weight="fill"
          style="font-variation-settings: &quot;FILL&quot; 1"
          >restaurant</span
        >
      </button>
      <button
        class="flex flex-col items-center justify-center text-slate-400 p-3 hover:text-[#FF5F40] transition-all"
      >
        <span class="material-symbols-outlined text-2xl" data-icon="favorite"
          >favorite</span
        >
      </button>
      <button
        class="flex flex-col items-center justify-center text-slate-400 p-3 hover:text-[#FF5F40] transition-all"
      >
        <span class="material-symbols-outlined text-2xl" data-icon="history"
          >history</span
        >
      </button>
    </nav>
  </body>
</html>
